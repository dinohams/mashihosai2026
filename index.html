<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>文化祭 3D校内マップ試作</title>
<style>
  :root{
    --bg:#eef3f8;
    --ink:#162033;
    --muted:#6d788a;
    --surface:rgba(255,255,255,.93);
    --line:rgba(22,32,51,.12);
    --blue:#2366d1;
    --cyan:#62b7ff;
    --accent:#ffd35c;
    --shadow:0 18px 55px rgba(24,39,68,.18);
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif;
    background:var(--bg);color:var(--ink)
  }
  #app{position:relative;width:100%;height:100%}
  #scene{position:absolute;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  .topbar{
    position:absolute;z-index:10;left:14px;right:14px;top:calc(12px + env(safe-area-inset-top));
    display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none
  }
  .titlebox{
    pointer-events:auto;background:var(--surface);backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.7);border-radius:18px;padding:10px 13px;
    box-shadow:0 8px 24px rgba(24,39,68,.10)
  }
  .titlebox small{display:block;font-size:10px;font-weight:900;letter-spacing:.12em;color:#70809a}
  .titlebox strong{display:block;font-size:17px;margin-top:2px}
  .reset{
    pointer-events:auto;border:0;background:var(--surface);backdrop-filter:blur(15px);
    border-radius:50%;width:45px;height:45px;box-shadow:0 8px 24px rgba(24,39,68,.10);
    font-size:20px;color:var(--ink)
  }

  .floor-tabs{
    position:absolute;z-index:11;right:14px;top:50%;transform:translateY(-50%);
    display:grid;gap:8px
  }
  .floor-btn{
    border:1px solid rgba(255,255,255,.8);
    background:rgba(255,255,255,.90);backdrop-filter:blur(14px);
    color:#5e6a7c;border-radius:15px;padding:11px 12px;min-width:60px;
    font-weight:950;box-shadow:0 7px 22px rgba(24,39,68,.10);
    transition:.22s ease
  }
  .floor-btn.active{
    color:#fff;background:linear-gradient(135deg,#1659c9,#408cf6);
    transform:scale(1.07);box-shadow:0 8px 26px rgba(35,102,209,.30)
  }

  .help{
    position:absolute;z-index:9;left:14px;bottom:calc(18px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.87);backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.75);border-radius:15px;
    padding:9px 11px;color:#647186;font-size:11px;font-weight:800;
    box-shadow:0 7px 22px rgba(24,39,68,.08);pointer-events:none
  }
  .help b{color:#33415a}
  .orientation{
    position:absolute;z-index:8;right:15px;bottom:calc(18px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.84);border-radius:14px;padding:9px 11px;
    font-size:10px;font-weight:900;color:#536078;box-shadow:0 7px 20px rgba(24,39,68,.08);
    pointer-events:none
  }

  .sheet{
    position:absolute;z-index:30;left:50%;bottom:0;width:min(100%,640px);
    transform:translate(-50%,110%);transition:.27s cubic-bezier(.2,.8,.2,1);
    padding:0 12px calc(12px + env(safe-area-inset-bottom));pointer-events:none
  }
  .sheet.show{transform:translate(-50%,0);pointer-events:auto}
  .sheet-inner{
    background:rgba(255,255,255,.97);backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.85);border-radius:25px 25px 18px 18px;
    box-shadow:var(--shadow);padding:17px 17px 16px
  }
  .handle{width:38px;height:4px;background:#d9dee7;border-radius:999px;margin:0 auto 12px}
  .sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:start}
  .room-kicker{font-size:10px;font-weight:950;letter-spacing:.12em;color:#6480ab}
  .sheet h2{margin:3px 0 4px;font-size:23px}
  .sub{font-size:12px;color:var(--muted);font-weight:800}
  .close{
    border:0;background:#edf1f6;color:#516078;width:36px;height:36px;border-radius:50%;font-weight:900
  }
  .program{
    margin-top:14px;padding:13px;border-radius:16px;background:#f5f8fc;border:1px solid #e6ebf2
  }
  .program strong{display:block;font-size:15px}
  .program p{margin:6px 0 0;font-size:12px;line-height:1.6;color:#697589}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .badge{font-size:10px;font-weight:900;padding:6px 8px;border-radius:999px;background:#fff;border:1px solid #e0e6ee}
  .badge.crowd{color:#a06400;background:#fff5d8;border-color:#f4deb0}

  .legend{
    position:absolute;z-index:8;left:14px;top:94px;
    background:rgba(255,255,255,.78);backdrop-filter:blur(10px);
    border-radius:13px;padding:8px 10px;font-size:10px;color:#6d788a;
    box-shadow:0 6px 18px rgba(24,39,68,.07);pointer-events:none
  }
  .legend span{display:inline-flex;align-items:center;gap:5px;margin-right:8px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .dot.class{background:#6aa9ff}.dot.special{background:#8cd6be}.dot.wc{background:#f0a8b8}

  @media(max-width:620px){
    .titlebox strong{font-size:15px}
    .floor-tabs{right:10px}
    .floor-btn{min-width:54px;padding:10px 9px}
    .legend{top:88px}
    .help{max-width:240px}
  }
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <div id="scene"></div>

  <div class="topbar">
    <div class="titlebox">
      <small>MASHIKO HOSEI FESTIVAL 2026</small>
      <strong>3D 校内マップ</strong>
    </div>
    <button class="reset" id="resetBtn" aria-label="視点を戻す">↺</button>
  </div>

  <div class="legend">
    <span><i class="dot class"></i>普通教室</span>
    <span><i class="dot special"></i>特別教室</span>
    <span><i class="dot wc"></i>トイレ</span>
  </div>

  <div class="floor-tabs">
    <button class="floor-btn active" data-floor="all">全体</button>
    <button class="floor-btn" data-floor="3">3F</button>
    <button class="floor-btn" data-floor="2">2F</button>
    <button class="floor-btn" data-floor="1">1F</button>
  </div>

  <div class="help">
    <b>ドラッグ</b> 回転　／　<b>2本指</b> 移動・ズーム<br>
    教室をタップすると詳細を表示
  </div>

  <div class="orientation">手前＝東　←　→　奥＝西</div>

  <div class="sheet" id="sheet">
    <div class="sheet-inner">
      <div class="handle"></div>
      <div class="sheet-head">
        <div>
          <div class="room-kicker" id="roomKicker">1F・CLASSROOM</div>
          <h2 id="roomName">3-2</h2>
          <div class="sub" id="roomLocation">教室棟 1階</div>
        </div>
        <button class="close" id="closeSheet">×</button>
      </div>
      <div class="program">
        <strong id="programTitle">企画情報はまだ未登録です</strong>
        <p id="programDesc">管理画面から企画名・紹介文・開催時間などを登録すると、ここに表示される想定です。</p>
        <div class="badges">
          <span class="badge" id="programTime">9:30〜15:00</span>
          <span class="badge crowd" id="programCrowd">混雑：未設定</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const host = document.getElementById('scene');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef3f8);
scene.fog = new THREE.Fog(0xeef3f8, 28, 55);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(-11.5, 10.5, 15.5);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
host.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .07;
controls.target.set(2.5, 3.2, 0);
controls.minDistance = 8;
controls.maxDistance = 34;
controls.maxPolarAngle = Math.PI * .49;
controls.minPolarAngle = Math.PI * .16;
controls.panSpeed = .75;
controls.rotateSpeed = .65;
controls.zoomSpeed = .8;

const hemi = new THREE.HemisphereLight(0xffffff,0x93a1b5,2.25);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff,3.0);
sun.position.set(-8,15,10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-20; sun.shadow.camera.right=20;
sun.shadow.camera.top=20; sun.shadow.camera.bottom=-20;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xb8d6ff,1.1);
fill.position.set(12,6,-10);
scene.add(fill);

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(42,28),
  new THREE.MeshStandardMaterial({color:0xe7ecef,roughness:1})
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.12;
ground.receiveShadow = true;
scene.add(ground);

// subtle paths
function pathStrip(x,z,w,d,rot=0){
  const m=new THREE.Mesh(
    new THREE.PlaneGeometry(w,d),
    new THREE.MeshStandardMaterial({color:0xd6dce2,roughness:1})
  );
  m.rotation.x=-Math.PI/2; m.rotation.z=rot; m.position.set(x,-.1,z);
  scene.add(m);
}
pathStrip(4.0,4.4,22,1.5,-.05);
pathStrip(-3.5,-4.2,12,1.2,.12);

// simple trees for theme-park-map vibe
function addTree(x,z,s=1){
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(.09*s,.12*s,.65*s,8),
    new THREE.MeshStandardMaterial({color:0x8b7255,roughness:1})
  );
  trunk.position.set(x,.25*s,z); trunk.castShadow=true;
  const crown = new THREE.Mesh(
    new THREE.IcosahedronGeometry(.48*s,1),
    new THREE.MeshStandardMaterial({color:0x7ab58a,roughness:.9})
  );
  crown.position.set(x,.78*s,z); crown.castShadow=true;
  scene.add(trunk,crown);
}
[[-8,4],[-6,5.2],[10,5.3],[12,3.5],[-7,-5],[9,-4.8],[12,-3.4],[-10,-2.8]].forEach((p,i)=>addTree(p[0],p[1],.9+(i%3)*.12));

// Data: user's east -> west order
const floors = {
  1: [
    {name:'地歴室',type:'special',w:2.15},
    {name:'女子トイレ',type:'wc',w:1.25},
    {name:'3-4',type:'class',w:1.72},
    {name:'3-3',type:'class',w:1.72},
    {name:'3-2',type:'class',w:1.72},
    {name:'3-1',type:'class',w:1.72},
    {name:'男子トイレ',type:'wc',w:1.25}
  ],
  2: [
    {name:'美術室',type:'special',w:2.15},
    {name:'男子トイレ',type:'wc',w:1.25},
    {name:'2-4',type:'class',w:1.72},
    {name:'2-3',type:'class',w:1.72},
    {name:'2-2',type:'class',w:1.72},
    {name:'2-1',type:'class',w:1.72},
    {name:'女子トイレ',type:'wc',w:1.25}
  ],
  3: [
    {name:'視聴覚室',type:'special',w:2.15},
    {name:'女子トイレ',type:'wc',w:1.25},
    {name:'1-4',type:'class',w:1.72},
    {name:'1-3',type:'class',w:1.72},
    {name:'1-2',type:'class',w:1.72},
    {name:'1-1',type:'class',w:1.72},
    {name:'男子トイレ',type:'wc',w:1.25}
  ]
};

const info = {
  '3-2': {title:'3年2組「文化祭ミニゲーム」',desc:'友達同士で気軽に遊べるミニゲーム企画です。',time:'9:30〜15:00',crowd:'やや混雑'},
  '2-1': {title:'2年1組「レトロ喫茶」',desc:'レトロな空間で写真撮影を楽しめる教室企画です。',time:'9:30〜15:00',crowd:'混雑'},
  '美術室': {title:'美術部 展示',desc:'美術部員の作品を展示しています。',time:'9:30〜15:00',crowd:'空いている'},
  '視聴覚室': {title:'映像企画',desc:'視聴覚室を使った映像コンテンツを予定しています。',time:'10:00〜14:30',crowd:'未設定'}
};

const building = new THREE.Group();
building.rotation.y = THREE.MathUtils.degToRad(-9);
scene.add(building);

const roomMeshes = [];
const floorGroups = {};
const floorHeight = 2.15;
const roomDepth = 3.15;
const wallH = .72;
const slabH = .18;
const corridorDepth = .95;
const totalW = 12.53;

const colors = {
  class: 0x76aef7,
  special: 0x7ac9ae,
  wc: 0xe9a5b3
};

function makeTextSprite(text, size=46){
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');
  const scale=2;
  canvas.width=420*scale; canvas.height=110*scale;
  ctx.scale(scale,scale);
  ctx.font=`900 ${size}px -apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(255,255,255,.96)';
  ctx.strokeStyle='rgba(20,35,55,.22)'; ctx.lineWidth=7;
  ctx.strokeText(text,210,55);
  ctx.fillStyle='#18263a';
  ctx.fillText(text,210,55);
  const tex=new THREE.CanvasTexture(canvas);
  tex.colorSpace=THREE.SRGBColorSpace;
  const mat=new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false});
  const spr=new THREE.Sprite(mat);
  spr.scale.set(2.6,.68,1);
  return spr;
}

function makeFloor(floorNum){
  const y=(floorNum-1)*floorHeight;
  const group=new THREE.Group();
  group.userData.floor=floorNum;
  floorGroups[floorNum]=group;
  building.add(group);

  // main slab
  const slabMat=new THREE.MeshStandardMaterial({
    color:0xf5f7fa,roughness:.76,metalness:0,
    transparent:true,opacity:1
  });
  const slab=new THREE.Mesh(new THREE.BoxGeometry(totalW+.35,slabH,roomDepth+corridorDepth+.4),slabMat);
  slab.position.set(totalW/2, y, 0);
  slab.castShadow=true; slab.receiveShadow=true;
  group.add(slab);

  // corridor strip (south/front side)
  const corridor=new THREE.Mesh(
    new THREE.BoxGeometry(totalW,.08,corridorDepth),
    new THREE.MeshStandardMaterial({color:0xe7ebef,roughness:.95,transparent:true,opacity:1})
  );
  corridor.position.set(totalW/2,y+.13,roomDepth/2+corridorDepth/2-.03);
  corridor.receiveShadow=true;
  group.add(corridor);

  let x=0;
  floors[floorNum].forEach((r)=>{
    const baseColor=colors[r.type];
    const mat=new THREE.MeshStandardMaterial({
      color:baseColor,roughness:.62,metalness:0,
      transparent:true,opacity:.90,
      emissive:baseColor,emissiveIntensity:.04
    });

    // low extruded room block
    const mesh=new THREE.Mesh(new THREE.BoxGeometry(r.w-.07,wallH,roomDepth-.08),mat);
    mesh.position.set(x+r.w/2,y+slabH/2+wallH/2+.02,0);
    mesh.castShadow=true; mesh.receiveShadow=true;
    mesh.userData={floor:floorNum,name:r.name,type:r.type,baseColor};
    group.add(mesh);
    roomMeshes.push(mesh);

    // roof/open top rim, gives stronger 3D outline
    const edges=new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(r.w-.07,wallH,roomDepth-.08)),
      new THREE.LineBasicMaterial({color:0x24405f,transparent:true,opacity:.24})
    );
    edges.position.copy(mesh.position);
    edges.userData.helperFor=mesh;
    group.add(edges);
    mesh.userData.edges=edges;

    const label=makeTextSprite(r.name, r.name.length>=5 ? 32 : 45);
    label.position.set(mesh.position.x,y+wallH+0.55,0);
    label.userData.helperFor=mesh;
    group.add(label);
    mesh.userData.label=label;

    x+=r.w;
  });

  // floor number marker at east end
  const floorLabel=makeTextSprite(`${floorNum}F`,52);
  floorLabel.scale.set(1.45,.65,1);
  floorLabel.position.set(-.72,y+1.0,1.0);
  group.add(floorLabel);
  floorLabel.userData.floorLabel=true;

  // vertical core at east end; just visual mass to avoid "flat boards"
  const core=new THREE.Mesh(
    new THREE.BoxGeometry(1.05,1.55,roomDepth+corridorDepth-.05),
    new THREE.MeshStandardMaterial({color:0xd9e0e8,roughness:.83,transparent:true,opacity:.96})
  );
  core.position.set(-.58,y+.82,0.25);
  core.castShadow=true; core.receiveShadow=true;
  group.add(core);
}
makeFloor(1);makeFloor(2);makeFloor(3);

// east-end vertical connection, gives whole building continuity
const spine = new THREE.Mesh(
  new THREE.BoxGeometry(.28, floorHeight*2+2.05, 4.0),
  new THREE.MeshStandardMaterial({color:0xcbd4dd,roughness:.8,transparent:true,opacity:.6})
);
spine.position.set(-1.08,2.55,.25);
spine.castShadow=true;
building.add(spine);

// under-shadow pads
for(let f=1;f<=3;f++){
  const y=(f-1)*floorHeight-.08;
  const shadow=new THREE.Mesh(
    new THREE.BoxGeometry(totalW+.7,.05,roomDepth+corridorDepth+.75),
    new THREE.MeshBasicMaterial({color:0x6d7a87,transparent:true,opacity:.08})
  );
  shadow.position.set(totalW/2,y,-.12);
  floorGroups[f].add(shadow);
}

// Floor selection
let selectedFloor='all';
function setFloorMode(floor){
  selectedFloor=floor;
  document.querySelectorAll('.floor-btn').forEach(b=>b.classList.toggle('active',b.dataset.floor===String(floor)));

  roomMeshes.forEach(mesh=>{
    const active = floor==='all' || mesh.userData.floor===Number(floor);
    mesh.material.opacity = active ? .92 : .12;
    mesh.material.emissiveIntensity = active && floor!=='all' ? .28 : .035;
    mesh.userData.edges.material.opacity = active ? .30 : .045;
    mesh.userData.label.material.opacity = active ? 1 : .12;
  });

  Object.entries(floorGroups).forEach(([num,g])=>{
    const active=floor==='all'||Number(num)===Number(floor);
    g.children.forEach(obj=>{
      if(obj.isMesh && !roomMeshes.includes(obj)){
        if(obj.material?.transparent) obj.material.opacity=active ? (obj.userData.floorLabel?1:.95) : .14;
      }
      if(obj.isSprite && obj.userData.floorLabel) obj.material.opacity=active?1:.16;
    });
  });

  if(floor==='all'){
    targetGoal.set(5.1,3.2,0);
    cameraGoal.set(-11.5,10.5,15.5);
  }else{
    const y=(Number(floor)-1)*floorHeight + .75;
    targetGoal.set(5.2,y,0);
    cameraGoal.set(-7.6,y+5.1,11.8);
  }
}
document.querySelectorAll('.floor-btn').forEach(b=>b.addEventListener('click',()=>setFloorMode(b.dataset.floor)));

// Smooth view transitions
const cameraGoal=camera.position.clone();
const targetGoal=controls.target.clone();
let transitioning=false;
function nudgeTransition(){
  transitioning=true;
  setTimeout(()=>transitioning=false,900);
}
document.querySelectorAll('.floor-btn').forEach(b=>b.addEventListener('click',nudgeTransition));

const homeCamera=new THREE.Vector3(-11.5,10.5,15.5);
const homeTarget=new THREE.Vector3(2.5,3.2,0);
document.getElementById('resetBtn').onclick=()=>{
  selectedFloor='all';
  setFloorMode('all');
  cameraGoal.copy(homeCamera); targetGoal.copy(homeTarget);
  transitioning=true; setTimeout(()=>transitioning=false,900);
};

// Picking
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
let downX=0,downY=0;
renderer.domElement.addEventListener('pointerdown',e=>{downX=e.clientX;downY=e.clientY;});
renderer.domElement.addEventListener('pointerup',e=>{
  if(Math.hypot(e.clientX-downX,e.clientY-downY)>8) return;
  const rect=renderer.domElement.getBoundingClientRect();
  pointer.x=((e.clientX-rect.left)/rect.width)*2-1;
  pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(roomMeshes,false);
  if(!hits.length) return;
  const mesh=hits[0].object;
  if(selectedFloor!=='all' && mesh.userData.floor!==Number(selectedFloor)) return;
  openRoom(mesh);
});

let highlighted=null;
function openRoom(mesh){
  if(highlighted && highlighted!==mesh){
    highlighted.material.emissiveIntensity = selectedFloor==='all' ? .035 : (highlighted.userData.floor===Number(selectedFloor)?.28:.035);
    highlighted.scale.set(1,1,1);
  }
  highlighted=mesh;
  mesh.material.emissiveIntensity=.62;
  mesh.scale.set(1.025,1.15,1.025);

  const {floor,name,type}=mesh.userData;
  const d=info[name];
  document.getElementById('roomKicker').textContent=`${floor}F・${type==='class'?'CLASSROOM':type==='wc'?'FACILITY':'SPECIAL ROOM'}`;
  document.getElementById('roomName').textContent=name;
  document.getElementById('roomLocation').textContent=`教室棟 ${floor}階`;
  document.getElementById('programTitle').textContent=d?.title || '企画情報はまだ未登録です';
  document.getElementById('programDesc').textContent=d?.desc || '管理画面から企画名・紹介文・開催時間などを登録すると、ここに表示される想定です。';
  document.getElementById('programTime').textContent=d?.time || '時間：未設定';
  document.getElementById('programCrowd').textContent=`混雑：${d?.crowd || '未設定'}`;
  document.getElementById('sheet').classList.add('show');
}
document.getElementById('closeSheet').onclick=()=>{
  document.getElementById('sheet').classList.remove('show');
  if(highlighted){
    highlighted.scale.set(1,1,1);
    highlighted.material.emissiveIntensity = selectedFloor==='all' ? .035 : (highlighted.userData.floor===Number(selectedFloor)?.28:.035);
    highlighted=null;
  }
};

// hover cursor desktop
renderer.domElement.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch') return;
  const rect=renderer.domElement.getBoundingClientRect();
  pointer.x=((e.clientX-rect.left)/rect.width)*2-1;
  pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(roomMeshes,false);
  const valid=hits.find(h=>selectedFloor==='all'||h.object.userData.floor===Number(selectedFloor));
  renderer.domElement.style.cursor=valid?'pointer':'grab';
});

// initial slight model offset
building.position.set(-2.6,0,-.15);

function resize(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}
addEventListener('resize',resize);

function animate(){
  requestAnimationFrame(animate);
  if(transitioning){
    camera.position.lerp(cameraGoal,.075);
    controls.target.lerp(targetGoal,.075);
  }
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
